services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_microservice}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-task_microservice}"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - shared_net
  user_api:
    build: .
    ports:
      - "${USER_API_PORT:-8001}:8001"
    volumes:
      - ./src/users_api:/app/src/users_api
    environment:
      # PostgreSQL service defined below in this compose file.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-task_microservice}
      USER_API_DB_SCHEMA: ${USER_API_DB_SCHEMA:-user_api}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to the shared local HS256 signing secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["uvicorn", "src.users_api.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared_net

networks:
  shared_net:
    name: shared_net
    external: true
